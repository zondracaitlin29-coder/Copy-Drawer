<style>
:root{
  --paper:#F6F1E4;
  --paper-2:#EDE4D0;
  --card:#FFFDF7;
  --ink:#241F2E;
  --ink-soft:#6B6478;
  --ink-faint:#A79FAE;
  --line:#DCD0B8;

  --hook:#B4740E;
  --hook-strong:#D98E2B;
  --hook-wash:#F6E7CE;

  --cta:#A23F26;
  --cta-strong:#B54A32;
  --cta-wash:#F3DED4;

  --topic:#264C50;
  --topic-strong:#2F5D62;
  --topic-wash:#DCE7E6;

  --highlighter:#F4C744;
  --highlighter-ink:#3A2E06;

  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-card:0 1px 2px rgba(36,31,46,.06), 0 6px 16px rgba(36,31,46,.06);
  --shadow-pop:0 10px 30px rgba(36,31,46,.18);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Source Serif 4', Georgia, serif;
  font-size:15px;
  line-height:1.5;
  overscroll-behavior-y:none;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,.ui,.tab-label,.field-label,.btn,button,input,select,.pill,.eyebrow{
  font-family:'Space Grotesk', system-ui, sans-serif;
}
button{font:inherit; cursor:pointer;}
.app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

/* ---------- Icons ---------- */
.icon-svg{display:inline-block; vertical-align:middle; flex-shrink:0;}

/* ---------- Label plate (wordmark, picker screen only) ---------- */
.label-plate{display:flex; justify-content:center; padding:30px 18px 4px;}
.plate-text{
  position:relative; background:var(--ink); color:var(--paper);
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px;
  letter-spacing:.16em; text-transform:uppercase; padding:10px 30px; border-radius:8px;
}
.plate-text::before, .plate-text::after{
  content:''; position:absolute; top:50%; width:5px; height:5px; border-radius:50%;
  background:var(--paper); opacity:.5; transform:translateY(-50%);
}
.plate-text::before{left:9px;}
.plate-text::after{right:9px;}

/* ---------- Picker screen ---------- */
.picker-wrap{flex:1; display:flex; flex-direction:column; justify-content:center; padding:14px 20px 40px;}
.picker-prompt{
  text-align:center; font-family:'Source Serif 4',serif; font-style:italic; font-size:17px;
  color:var(--ink-soft); margin:6px 0 26px;
}
.cabinet{display:flex; flex-direction:column; gap:14px;}
.drawer-front{
  position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; width:100%;
  text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:16px;
  padding:18px 16px 18px 20px; box-shadow:var(--shadow-card); transition:transform .1s ease;
}
.drawer-front::before{content:''; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--accent);}
.drawer-front[data-color="hook"]{--accent:var(--hook-strong); --wash:var(--hook-wash);}
.drawer-front[data-color="cta"]{--accent:var(--cta-strong); --wash:var(--cta-wash);}
.drawer-front[data-color="topic"]{--accent:var(--topic-strong); --wash:var(--topic-wash);}
.drawer-front:active{transform:scale(.985);}
.df-handle{flex-shrink:0; color:var(--accent); opacity:.5;}
.df-main{flex:1; display:flex; flex-direction:column; gap:4px; min-width:0;}
.df-label{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; color:var(--ink);
  display:flex; align-items:center; gap:8px;
}
.df-badge{
  font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  color:var(--accent); background:var(--wash); padding:2px 8px; border-radius:10px;
}
.df-sub{font-size:12.5px; color:var(--ink-soft); font-family:'Space Grotesk',sans-serif;}
.df-chev{flex-shrink:0; color:var(--ink-faint);}

/* ---------- Header (drawer view) ---------- */
.hdr{
  padding:18px 18px 2px;
  display:flex; align-items:center; justify-content:space-between;
}
.back-btn{
  display:flex; align-items:center; gap:6px; border:none; background:none;
  color:var(--ink-soft); font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; padding:4px 2px;
}
.hdr .count-tag{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
.drawer-title{
  padding:2px 18px 12px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:23px; color:var(--accent);
}
.drawer-title[data-color="hook"]{--accent:var(--hook-strong); color:var(--hook-strong);}
.drawer-title[data-color="cta"]{--accent:var(--cta-strong); color:var(--cta-strong);}
.drawer-title[data-color="topic"]{--accent:var(--topic-strong); color:var(--topic-strong);}

/* ---------- Search + filters ---------- */
.search-wrap{
  background:var(--card); padding:12px 14px 10px; position:sticky; top:0; z-index:4;
  border-bottom:1px solid var(--line);
}

.search-input{
  width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--paper); font-family:'Source Serif 4',serif; font-size:14.5px; color:var(--ink);
}
.search-input:focus{outline:none; border-color:var(--ink-soft);}
.filter-row{display:flex; gap:7px; overflow-x:auto; padding-top:10px; scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{
  flex-shrink:0; padding:6px 13px; border-radius:20px; border:1.5px solid var(--line);
  background:var(--paper); color:var(--ink-soft); font-size:12.5px; font-weight:600; white-space:nowrap;
}
.filter-chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

/* ---------- List ---------- */
.list{padding:14px 14px 100px; display:flex; flex-direction:column; gap:10px; flex:1;}
.empty-state{
  margin-top:30px; text-align:center; padding:30px 20px; color:var(--ink-soft);
}
.empty-state .ico{display:flex; justify-content:center; margin-bottom:10px; color:var(--ink-faint);}
.empty-state b{color:var(--ink); display:block; font-family:'Space Grotesk',sans-serif; margin-bottom:4px;}

/* ---------- Card ---------- */
.item-card{
  background:var(--card); border-radius:var(--radius-md); box-shadow:var(--shadow-card);
  border-left:4px solid var(--accent); overflow:hidden;
}
.item-card[data-color="hook"]{--accent:var(--hook-strong);}
.item-card[data-color="cta"]{--accent:var(--cta-strong);}
.item-card[data-color="topic"]{--accent:var(--topic-strong);}
.item-head{
  display:flex; align-items:flex-start; gap:10px; padding:13px 14px; text-align:left; width:100%; background:none; border:none;
}
.item-head .pin-ico{flex-shrink:0; font-size:13px; margin-top:2px; color:var(--ink-faint);}
.item-head.pinned .pin-ico{color:var(--accent);}
.item-head .preview{flex:1; font-size:14.5px; color:var(--ink); line-height:1.45;}
.item-head .preview b{display:block; font-family:'Space Grotesk',sans-serif; font-size:14px; margin-bottom:2px; font-weight:600;}
.item-head .chev{flex-shrink:0; font-size:12px; color:var(--ink-faint); margin-top:3px; transition:transform .15s ease;}
.item-head.open .chev{transform:rotate(90deg);}
.item-tags-row{display:flex; gap:5px; flex-wrap:wrap; padding:0 14px 10px 37px; margin-top:-6px;}
.item-tags-row .tag{font-size:10.5px; font-weight:600; color:var(--accent); background:var(--wash); padding:2px 8px; border-radius:10px;}
.item-card[data-color="hook"] .tag{background:var(--hook-wash);}
.item-card[data-color="cta"] .tag{background:var(--cta-wash);}
.item-card[data-color="topic"] .tag{background:var(--topic-wash);}

.item-body{padding:0 14px 14px 14px; border-top:1px dashed var(--line);}
.item-full-text{
  margin:12px 0; font-size:15px; line-height:1.6; color:var(--ink); white-space:pre-wrap;
}
.point{margin:12px 0;}
.point-label{
  font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--accent); display:block; margin-bottom:3px;
}
.point-row{display:flex; align-items:flex-start; gap:8px;}
.point-text{flex:1; font-size:14.5px; line-height:1.55; color:var(--ink); white-space:pre-wrap;}
.point-copy{
  flex-shrink:0; border:none; background:var(--paper-2); color:var(--ink-soft); width:28px; height:28px;
  border-radius:8px; font-size:13px; display:flex; align-items:center; justify-content:center;
}

.copy-btn{
  position:relative; overflow:hidden; display:block; width:100%; text-align:center; border:none;
  background:var(--highlighter); color:var(--highlighter-ink); font-weight:700; font-size:13.5px;
  padding:11px; border-radius:11px; margin-top:6px;
}
.copy-btn.ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink-soft); font-weight:600;}
.action-row{display:flex; gap:8px; margin-top:10px;}
.action-row .copy-btn{margin-top:0;}
.icon-btn{
  flex-shrink:0; border:1.5px solid var(--line); background:var(--card); color:var(--ink-soft);
  width:40px; border-radius:11px; font-size:15px;
}
.sweep::before{
  content:''; position:absolute; inset:0; background:rgba(255,255,255,.55); transform:translateX(-105%);
}
.sweep.go::before{transform:translateX(105%); transition:transform .45s ease;}

/* ---------- FAB ---------- */
.fab{
  position:fixed; right:20px; bottom:24px; width:56px; height:56px; border-radius:16px;
  background:var(--ink); color:var(--paper); border:none; font-size:26px; font-weight:600;
  box-shadow:var(--shadow-pop); z-index:20; max-width:480px;
}
.fab[data-color="hook"]{background:var(--hook);}
.fab[data-color="cta"]{background:var(--cta);}
.fab[data-color="topic"]{background:var(--topic);}

/* ---------- Sheet (add/edit modal) ---------- */
.sheet-backdrop{
  position:fixed; inset:0; background:rgba(36,31,46,.45); z-index:30;
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet{
  width:100%; max-width:480px; background:var(--paper); border-radius:22px 22px 0 0;
  max-height:88vh; overflow-y:auto; padding:8px 18px 22px;
  box-shadow:var(--shadow-pop);
}
.sheet-handle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:8px auto 14px;}
.sheet h2{font-size:18px; margin:0 0 14px; font-weight:700;}
.field-label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin:14px 0 6px;}
.field-label:first-of-type{margin-top:0;}
.text-input, .text-area{
  width:100%; border:1.5px solid var(--line); background:var(--card); border-radius:12px;
  padding:11px 13px; font-family:'Source Serif 4',serif; font-size:14.5px; color:var(--ink);
}
.text-area{min-height:90px; resize:vertical; line-height:1.5;}
.point-edit-row{
  background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px;
}
.point-edit-row .row-top{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.point-edit-row .label-input{flex:1; font-weight:600; font-size:13px; border:none; background:none; padding:2px 0; font-family:'Space Grotesk',sans-serif;}
.point-edit-row .label-input:focus{outline:none;}
.point-edit-row .remove-point{flex-shrink:0; border:none; background:none; color:var(--ink-faint); font-size:16px;}
.add-point-btn{
  width:100%; border:1.5px dashed var(--line); background:none; color:var(--ink-soft); font-weight:600;
  font-size:13px; padding:10px; border-radius:12px; margin-bottom:6px;
}
.tag-chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
.tag-chip{
  display:flex; align-items:center; gap:5px; background:var(--paper-2); color:var(--ink); font-size:12px;
  font-weight:600; padding:5px 6px 5px 11px; border-radius:16px;
}
.tag-chip button{background:none; border:none; color:var(--ink-faint); font-size:13px; padding:0 4px;}
.tag-suggest-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
.tag-suggest{
  background:none; border:1.5px dashed var(--line); color:var(--ink-soft); font-size:11.5px; font-weight:600;
  padding:4px 10px; border-radius:14px;
}
.sheet-actions{display:flex; gap:10px; margin-top:20px;}
.btn-primary{
  flex:1; background:var(--ink); color:var(--paper); border:none; padding:13px; border-radius:13px; font-weight:700; font-size:14.5px;
}
.btn-secondary{
  border:1.5px solid var(--line); background:none; color:var(--ink-soft); padding:13px 18px; border-radius:13px; font-weight:600; font-size:14.5px;
}
.danger-link{
  display:block; text-align:center; margin-top:16px; color:var(--cta); font-size:13px; font-weight:600;
  background:none; border:none;
}

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px); opacity:0;
  background:var(--ink); color:var(--paper); padding:11px 20px; border-radius:12px; font-size:13.5px;
  font-family:'Space Grotesk',sans-serif; font-weight:600; z-index:50; pointer-events:none; transition:all .25s ease;
  box-shadow:var(--shadow-pop); max-width:88%; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media (min-width:481px){
  .fab{right:calc(50% - 240px + 20px);}
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* =========================================================
   COPY DRAWER — hooks, CTAs, and topic talking-points,
   organized into drawers you tap open and copy from.
========================================================= */
const STORE_KEY = 'copyDrawerState_v1';
const DRAWERS = [
  {id:'hooks',  label:'Hooks',  color:'hook',  noun:'hook'},
  {id:'ctas',   label:'CTAs',   color:'cta',   noun:'CTA'},
  {id:'topics', label:'Topics', color:'topic', noun:'topic'},
];
const DEFAULT_POINT_LABELS = ['Why it matters','Who needs it','How it helps','Common mistake','Quick fix','Example'];
const SUGGESTED_TAGS = {
  hooks:  ['curiosity','bold claim','question','story','stat','relatable','controversial'],
  ctas:   ['soft ask','hard sell','urgent','free offer','comment below','dm me','link in bio'],

function seedIfNeeded(loaded){
  if(localStorage.getItem(SEED_FLAG_KEY)) return loaded;
  const mk = (base, extra) => Object.assign({id:uid('item'), tags:[], points:[], pinned:false, archived:false, createdAt: Date.now()}, base, extra||{});
  loaded.hooks = [...SEED_HOOKS.map(h=>mk({text:h.text, tags:h.tags})), ...loaded.hooks];
  loaded.ctas = [...SEED_CTAS.map(c=>mk({text:c.text, tags:c.tags})), ...loaded.ctas];
  loaded.topics = [...SEED_TOPICS.map(t=>mk({title:t.title, tags:t.tags, points:t.points.map(p=>({id:uid('pt'), label:p.label, text:p.text}))})), ...loaded.topics];
  localStorage.setItem(SEED_FLAG_KEY, '1');
  return loaded;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      return Object.assign({hooks:[],ctas:[],topics:[],usage:freshUsage()}, parsed);
    }
  }catch(e){}
  return {hooks:[],ctas:[],topics:[],usage:freshUsage()};
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function uid(p){ return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
function escapeHTML(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jsq(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); } // safe for embedding inside a single-quoted JS string in an onclick="" attribute
function drawerMeta(id){ return DRAWERS.find(d=>d.id===id); }

}

/* ---------- Clipboard ---------- */
function copyText(text, btnEl){
  const done = ()=>{
    showToast('Copied \u2713');
    if(btnEl){ btnEl.classList.add('sweep','go'); setTimeout(()=>btnEl.classList.remove('sweep','go'), 500); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>showToast('Could not copy \u2014 select and copy manually'));
  } else {
    showToast('Copy not supported on this browser');
  }
}
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ---------- Derived data ---------- */
function itemsFor(drawerId){ return state[drawerId] || []; }
function allTags(drawerId){
  const set = new Set();
  itemsFor(drawerId).forEach(i=> (i.tags||[]).forEach(t=>set.add(t)));
  return Array.from(set).sort();
}
function matchesSearch(item, q){
  if(!q) return true;
  const hay = [item.title, item.text, ...(item.points||[]).map(p=>p.label+' '+p.text), ...(item.tags||[])]
    .filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}
function visibleItems(drawerId){
  let list = itemsFor(drawerId);
  if(ui.filter==='archived'){ list = list.filter(i=>i.archived); }
  else{
    list = list.filter(i=>!i.archived);
    if(ui.filter==='pinned') list = list.filter(i=>i.pinned);
    else if(ui.filter!=='all') list = list.filter(i=>(i.tags||[]).includes(ui.filter));
  }
  list = list.filter(i=>matchesSearch(i, ui.search));
  return list.slice().sort((a,b)=>{
    if(!!b.pinned - !!a.pinned !== 0) return (b.pinned?1:0)-(a.pinned?1:0);
    return b.createdAt - a.createdAt;
  });
}

/* ---------- Render ---------- */
function render(){
  if(ui.view==='picker'){ renderPicker(); return; }
  renderDrawerView();
}

/* ---------- Picker screen — "what are we looking for today?" ---------- */
function mostUsedDrawer(){
  let best=null, bestCount=0;
  DRAWERS.forEach(d=>{
    const c = (state.usage[d.id]||{}).count||0;
    if(c>bestCount){ bestCount=c; best=d.id; }
  });
  return best;
}
function drawerSmartNote(d){
  const u = state.usage[d.id] || {count:0,last:0};
  if(u.count===0) return 'Not opened yet';
  const days = Math.floor((Date.now()-u.last)/86400000);
  if(days<=0) return 'Opened today';
  if(days===1) return 'Opened yesterday';
  return `${days} days since last open`;
}
function openDrawer(id){
  const u = state.usage[id] || (state.usage[id]={count:0,last:0});
  u.count += 1;
  u.last = Date.now();
  saveState();
  ui.view='drawer'; ui.activeDrawer=id; ui.filter='all'; ui.search=''; ui.expandedId=null;
  render();
}
function backToPicker(){ ui.view='picker'; render(); }

function drawerFrontHTML(d){
  const items = itemsFor(d.id).filter(i=>!i.archived);
  const isMostUsed = mostUsedDrawer()===d.id && items.length>0 && (state.usage[d.id]||{}).count>0;
  return `
    <button class="drawer-front" data-color="${d.color}" onclick="openDrawer('${d.id}')">
      <span class="df-handle">${ICONS.handle()}</span>
      <span class="df-main">
        <span class="df-label">${d.label}${isMostUsed?'<span class="df-badge">Most used</span>':''}</span>
        <span class="df-sub">${items.length} saved \u00b7 ${drawerSmartNote(d)}</span>
      </span>
      <span class="df-chev">${ICONS.chevron()}</span>
    </button>`;
}

function tagsRowHTML(item, color){

function cardHTML(item){
  const meta = drawerMeta(ui.activeDrawer);
  const isOpen = ui.expandedId===item.id;
  const previewLabel = ui.activeDrawer==='topics' ? escapeHTML(item.title||'(untitled topic)') : escapeHTML(firstLine(item.text||''));

function firstLine(text){

/* ---------- Nav / filter actions ---------- */
function setFilter(f){ ui.filter=f; ui.expandedId=null; render(); }
function setSearch(v){ ui.search=v; render(); keepSearchFocus(); }
function keepSearchFocus(){
  const el = document.querySelector('.search-input');
  if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
}
function toggleExpand(id){ ui.expandedId = ui.expandedId===id ? null : id; render(); }

/* ---------- Item mutations ---------- */
function findItem(id){
  for(const d of DRAWERS){
    const found = (state[d.id]||[]).find(i=>i.id===id);
    if(found) return {item:found, drawer:d.id};
  }
  return null;
}
function togglePin(id){
  const f = findItem(id); if(!f) return;
  f.item.pinned = !f.item.pinned;
  saveState(); render();
}
function toggleArchive(id){
  const f = findItem(id); if(!f) return;
  f.item.archived = !f.item.archived;
  ui.expandedId = null;
  saveState(); render();
  showToast(f.item.archived ? 'Archived' : 'Restored');
}
function deleteItem(id){
  const f = findItem(id); if(!f) return;
  if(!confirm('Delete this for good? This can\u2019t be undone.')) return;
  state[f.drawer] = state[f.drawer].filter(i=>i.id!==id);
  ui.expandedId = null;
  ui.sheet = null;
  saveState(); render();
  showToast('Deleted');
}

/* ---------- Copy actions ---------- */
function copyItemText(id, btn){
  const f = findItem(id); if(!f) return;
  copyText(f.item.text, btn);
}
function copyPoint(topicId, pointId, btn){
  const f = findItem(topicId); if(!f) return;
  const p = (f.item.points||[]).find(p=>p.id===pointId);
  if(!p) return;
  copyText(p.text, btn);
}
function copyAllTopic(topicId, btn){
  const f = findItem(topicId); if(!f) return;
  const t = f.item;
  const block = `${t.title}\n\n` + (t.points||[]).map(p=>`${p.label}: ${p.text}`).join('\n\n');
  copyText(block, btn);
}

/* ---------- Add / edit sheet ---------- */
function openAddSheet(drawerId){
  ui.sheet = {
    drawer: drawerId, id:null,
    text:'', title:'',
    tags:[],
    points: drawerId==='topics' ? DEFAULT_POINT_LABELS.slice(0,3).map(l=>({id:uid('pt'), label:l, text:''})) : []
  };
  render();
}
function openEditSheet(id){
  const f = findItem(id); if(!f) return;
  ui.sheet = {
    drawer: f.drawer, id: f.item.id,
    text: f.item.text||'', title: f.item.title||'',
    tags: (f.item.tags||[]).slice(),
    points: (f.item.points||[]).map(p=>({id:p.id, label:p.label, text:p.text}))
  };
  ui.expandedId = null;
  render();
}
function closeSheet(ev){
  if(ev && ev.target !== ev.currentTarget) return;
  ui.sheet = null;
  render();
}
function updateSheetField(field, value){ if(ui.sheet) ui.sheet[field]=value; }
function addPointRow(){
  if(!ui.sheet) return;
  ui.sheet.points.push({id:uid('pt'), label:'', text:''});
  render();
}
function removePointRow(pid){
  if(!ui.sheet) return;
  ui.sheet.points = ui.sheet.points.filter(p=>p.id!==pid);
  render();
}
function updatePointField(pid, field, value){
  if(!ui.sheet) return;
  const p = ui.sheet.points.find(p=>p.id===pid);
  if(p) p[field]=value;
}
function addTagToSheet(){
  const input = document.getElementById('newTagInput');
  const val = (input.value||'').trim();
  if(!val || !ui.sheet) return;
  if(!ui.sheet.tags.includes(val)) ui.sheet.tags.push(val);
  input.value='';
  render();
}
function removeTagFromSheet(tag){
  if(!ui.sheet) return;
  ui.sheet.tags = ui.sheet.tags.filter(t=>t!==tag);
  render();
}
function saveSheet(){
  if(!ui.sheet) return;
  const s = ui.sheet;
  if(s.drawer==='topics'){
    if(!s.title.trim()){ showToast('Give the topic a title first'); return; }
  } else {
    if(!s.text.trim()){ showToast('Add some text first'); return; }
  }
  const arr = state[s.drawer];
  if(s.id){
    const existing = arr.find(i=>i.id===s.id);
    if(existing){
      existing.text = s.text; existing.title = s.title; existing.tags = s.tags;
      existing.points = s.points.filter(p=>p.label.trim()||p.text.trim());
    }
  } else {
    arr.unshift({
      id: uid(s.drawer.slice(0,-1)||'item'),
      text: s.text, title: s.title, tags: s.tags,
      points: s.points.filter(p=>p.label.trim()||p.text.trim()),
      pinned:false, archived:false, createdAt: Date.now()
    });
  }
  saveState();
  ui.sheet = null;
  render();
  showToast('Saved \u2713');
}

function sheetHTML(){
  const s = ui.sheet;
  const meta = drawerMeta(s.drawer);
  const isTopic = s.drawer==='topics';
  const existingTags = Array.from(new Set([...(SUGGESTED_TAGS[s.drawer]||[]), ...allTags(s.drawer)]))
    .filter(t=>!s.tags.includes(t));

  const body = isTopic ? `
      <span class="field-label">Topic title</span>
      <input class="text-input" value="${escapeHTML(s.title)}" placeholder="e.g. FAQ \u2192 Quick replies"
        oninput="updateSheetField('title', this.value)" />

      <span class="field-label">Talking points</span>
      ${s.points.map(p=>`
        <div class="point-edit-row">
          <div class="row-top">
            <input class="label-input" value="${escapeHTML(p.label)}" placeholder="Label, e.g. Why it matters"
              oninput="updatePointField('${p.id}','label',this.value)" />
            <button class="remove-point" onclick="removePointRow('${p.id}')">\u2715</button>
          </div>
          <textarea class="text-area" style="min-height:56px;" placeholder="What goes here\u2026"
            oninput="updatePointField('${p.id}','text',this.value)">${escapeHTML(p.text)}</textarea>
        </div>`).join('')}
      <button class="add-point-btn" onclick="addPointRow()">+ Add talking point</button>
  ` : `
      <span class="field-label">${meta.noun} text</span>
      <textarea class="text-area" placeholder="Write your ${meta.noun.toLowerCase()}\u2026"
        oninput="updateSheetField('text', this.value)">${escapeHTML(s.text)}</textarea>
  `;

  return `
    <div class="sheet-backdrop" onclick="closeSheet(event)">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <h2>${s.id ? 'Edit' : 'New'} ${meta.noun}</h2>
        ${body}
        <span class="field-label">Tags</span>
        <div class="tag-chip-row">
          ${s.tags.map(t=>`<span class="tag-chip">${escapeHTML(t)} <button onclick="removeTagFromSheet('${jsq(t)}')">\u2715</button></span>`).join('')}
        </div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <input class="text-input" id="newTagInput" placeholder="Add a tag\u2026" style="flex:1;" onkeydown="if(event.key==='Enter'){event.preventDefault(); addTagToSheet();}" />
          <button class="btn-secondary" onclick="addTagToSheet()">Add</button>
        </div>
        ${existingTags.length ? `<div class="field-label" style="margin-top:10px;">Suggested</div><div class="tag-suggest-row">${existingTags.map(t=>`<button class="tag-suggest" onclick="(function(){ui.sheet.tags.push('${jsq(t)}');render();})()">+ ${escapeHTML(t)}</button>`).join('')}</div>` : ''}

        <div class="sheet-actions">
          <button class="btn-secondary" onclick="closeSheet()">Cancel</button>
          <button class="btn-primary" onclick="saveSheet()">Save</button>
        </div>
        ${s.id ? `<button class="danger-link" onclick="deleteItem('${s.id}')">Delete this ${meta.noun.toLowerCase()}</button>` : ''}
      </div>
    </div>`;
}

/* ---------- PWA ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

render();
</script>
</body>
</html>
